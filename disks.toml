requires = ["tt-rodionov"]
suggests = ["dir-rodionov", "dup-omega", "pip-omega"]
requires_by_media = { dz = ["dz-rodionov"], dv = ["dv-omega"] }
startup  = ["SET TT QUIET"]
reserved = [{ side = 1, lbn = 792, path = "kits/rodionov/SIDE1-792.BLK" },   # the copy protection
            { side = 1, lbn = 799, path = "kits/rodionov/SIDE1-799.BLK" }]

