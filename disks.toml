# What a disk is made of.  ASSEMBLED - do not edit: this file is made by
# tools/build_disks_toml.py out of the pieces that lie with the files they
# describe - disks.head.toml (this heading, the media, the presets),
# kits.toml (which kits there are and in what order) and a bundles.toml in
# every folder that has files on a disk.  CI checks the two agree.
#
# Read by the composer (`ms0515-disk compose` over a local copy of this
# repository, and the web wizard over its Pages) and by the release, which
# builds every preset below.  A preset is exactly what the wizard makes from
# the same choices.

format = 2

# The version of this description - of what the collection holds and how it
# makes disks.  A choice saved by a wizard names it; a disks release is tagged
# disks-<version>, and its CI refuses a tag that says otherwise.
version = "2026.09.22"

# ---- media ---------------------------------------------------------------
# The composer knows these three; they are listed only as the words used
# below.
#   ss  400 KB single-sided: one DZ volume
#   dz  800 KB double-sided: two DZ volumes, DZ0 boots, DZ2 is the second
#   dv  800 KB double-sided: one DV whole-disk volume of 1600 blocks

# ---- kits ----------------------------------------------------------------
# A kit is what came together: a monitor and the handlers, utilities and
# tools of its make, a folder each under kits/.  A system names its kit, and so
# does every bundle that is a part of one; the wizard lists a kit's bundles by
# the system chosen - its own kit as "System", the others under "Other kits" -
# and `group` is then the place inside the kit (Handlers, Utilities,
# Development).

[kit.osa]
title = "OSA"
path  = "kits/osa"

[kit.omega]
title = "OMEGA"
path  = "kits/omega"

[kit.mihin]
title = "Mihin's OS-16SJ"
path  = "kits/mihin"

[kit.rodionov]
title = "Rodionov's RT15SJ"
path  = "kits/rodionov"

[kit.dec]
title = "RT-11 V5.4 from DEC's sources"
path  = "kits/dec"

[kit.vvv]
title = "the vvv104 diskettes (OMEGA2, FODOS builds)"
path  = "kits/vvv"

# Not a kit of a machine: what every system can take and the collection
# has one build of.  The wizard lists it under "System" whichever system
# is chosen, after that system's own.
[kit.common]
title  = "common to every system"
path   = "kits/common"
common = true

# ---- systems -------------------------------------------------------------
# Every disk is made from scratch.  A system gives only what exists nowhere
# else: its monitor - in its kit's folder, patched to run DEC's STARTS.COM -
# and, Rodionov's, the blocks it protects; SWAP.SYS is scratch the monitor
# writes before it reads, so the composer makes it, of zeros, as long as the
# system's own was; the bootstrap is written for the media.  Everything else
# is bundles: the handlers and utilities the system cannot work without are
# the bundles it requires, of the builds its original disks carried.
#
#   monitor            the monitor's file and its date
#   swap               the length of SWAP.SYS in blocks, and its date
#   startup_date       the date of the startup command file
#   media              what the monitor boots from
#   requires           the bundles it cannot work without
#   suggests           its own builds of the utilities its disks carried (DIR,
#                      DUP, PIP): not ticked by themselves - a games disk can do
#                      without - but one ticked follows the system when it changes
#   prefer             its own builds where it requires a name several provide
#                      ("dir"): what sat on its original disks; another can be picked
#   requires_by_media  those only one media needs: the handler it boots through -
#                      DZ.SYS on ss and dz, DV.SYS on dv (a DV disk boots without DZ.SYS)
#   startup            the first lines of the startup command file
#   reserved           blocks the system protects - a side and its DZ block, the
#                      file of its 512 bytes: put on their sectors, no file takes them

[system.osa]
title    = "OSA 1.0"
kit      = "osa"
monitor  = { path = "kits/osa/MON8SJ.SYS", date = "1990-12-27" }
swap     = { blocks = 32, date = "1990-12-27" }
startup_date = "1995-04-01"
media    = ["ss", "dz", "dv"]
requires = ["tt-osa"]
suggests = ["dir-osa", "dup-omega", "pip-omega"]
requires_by_media = { ss = ["dz-osa"], dz = ["dz-osa"], dv = ["dv-omega"] }
startup  = ["SET TT QUIET"]

# ---- osa -------------------------------------------------------------------

[system.omega]
title    = "OMEGA SJ(S) V05.04"
kit      = "omega"
monitor  = { path = "kits/omega/RT11SJ.SYS", date = "1991-11-12" }
swap     = { blocks = 32, date = "1989-12-11" }
startup_date = "1995-04-01"
media    = ["ss", "dz", "dv"]
requires = ["tt-omega"]
suggests = ["dir-omega", "dup-omega", "pip-omega"]
requires_by_media = { ss = ["dz-omega"], dz = ["dz-omega"], dv = ["dv-omega"] }
startup  = ["SET TT QUIET"]

# ---- omega -----------------------------------------------------------------

[system.mihin]
title    = "OS-16SJ (Mihinsoft)"
