# ---- presets -------------------------------------------------------------
#   startup  START.COM, line by line; omitted - the exemplar's own

[preset.games]
title   = "ОСА: игры"
system  = "osa"
media   = "dz"
bundles = ["sabot2", "fist", "pacman", "arcade", "osa-games", "text-games"]

[preset.devel]
title   = "ОМЕГА vvv104: разработка"
system  = "omega2"
media   = "dv"
bundles = ["vvv-macro", "pascal", "fortran", "basico", "vvv-tools", "minesweeper"]

[preset.rodionov]
title   = "Родионов: ROSA Commander"
system  = "rodionov"
media   = "dz"
bundles = ["rosa", "basico", "rosa-docs"]
startup = ["SET TT QUIET", "SET SL ON", "LOAD VM:", "R ROSA3"]

[preset.mihin]
title   = "Михин: OS-16SJ"
system  = "mihin"
media   = "dz"
bundles = ["mihin-tools"]
