# What a disk is made of.
#
# Read by the composer (`ms0515-disk compose` over a local copy of this
# repository, and the web wizard over its Pages) and by the release, which
# builds every preset below.  A preset is exactly what the wizard makes from
# the same choices.

format = 1

# ---- media ---------------------------------------------------------------
# The composer knows these three; they are listed only as the words used
# below.
#   ss  400 KB single-sided: one DZ volume
#   dz  800 KB double-sided: two DZ volumes, DZ0 boots, DZ2 is the second
#   dv  800 KB double-sided: one DV whole-disk volume of 1600 blocks

# ---- systems -------------------------------------------------------------
# A system is an exemplar from systems/.  Its kit - monitor, SWAP, handlers,
# DIR/DUP/PIP, START.COM, the bootstrap - comes from that image: monitors do
# not exist here as loose files.
#
#   media    what the monitor boots from
#   rebuild  false: the image is the base as it is (Rodionov's protection
#            lives outside the file system), so only its own media is offered

[system.osa]
title  = "ОСА 1.0"
image  = "systems/osa.dsk"
media  = ["ss", "dz", "dv"]

[system.omega]
title  = "ОМЕГА SJ(S) V05.04"
image  = "systems/omega.dsk"
media  = ["ss", "dz", "dv"]

[system.omega2]
title  = "ОМЕГА SJ(S) V05.04, vvv104"
image  = "systems/omega2.dsk"
media  = ["ss", "dz", "dv"]

[system.mihin]
title  = "OS-16SJ (Mihinsoft)"
image  = "systems/mihin.dsk"
media  = ["ss", "dz"]           # the monitor refuses DV.SYS

[system.rodionov]
title   = "RT15SJ (Родионов)"
image   = "systems/rodionov.dsk"
media   = ["dz"]
rebuild = false

# ---- bundles -------------------------------------------------------------
# What one checkbox adds.  A bundle's files stay on one volume together (a
# loader and its data, a program and its sprite table).
#
#   files    paths in this repository; a glob expands in name order; an
#            inline table renames on the disk: { path = "...", as = "K52.SAV" }
#   volume   "boot" (default): the volume the system boots from - a bare
#            name runs only from DK:.  "any": may go to DZ2 when the boot
#            volume is full (text games run as R DZ2:NAME, documents)
#   needs    media the bundle cannot live without
#   systems  only these systems (default: every one)
#   date     the RT-11 date of its files, 1972..2003 (a file may carry its
#            own: { path = "...", date = "..." })
#   protect  set [P] on its files (default false)

# -- games

[bundle.sabot2]
title   = "Saboteur 2"
needs   = ["ss", "dz"]          # the loader opens DZ:SABOT2.DAT by name
systems = ["osa"]
date    = "1990-11-09"
files   = ["software/games/sabot2/fixed/osa/SABOT2.SAV",
           "software/games/sabot2/fixed/osa/SABOT2.DAT"]

[bundle.fist]
title = "The Way Of The Exploding Fist"
date  = "2003-01-01"
files = ["software/games/fist/FIST.SAV", "software/games/fist/FIST.DAT"]

[bundle.pacman]
title = "Pac-Man"
date  = "1989-04-30"
files = ["software/games/pacman/*"]

[bundle.arcade]
title = "Аркады"
date  = "1991-11-12"
files = [
  "software/games/BIRDS.SAV",
  "software/games/EXPRES.SAV",
  "software/games/EXPRES.TXT",
  "software/games/tetris/*",
]

[bundle.osa-games]
title   = "Игры ОСА"
systems = ["osa"]
date    = "1992-03-27"
files   = ["software/games/osa/KOSMOS.SAV", "software/games/osa/HANOJ.SAV"]

[bundle.text-games]
title  = "Текстовые игры"
volume = "any"
date   = "1991-01-31"
files  = [
  "software/games/KING.SAV", "software/games/KING.DAT",
  "software/games/KAM1.SAV", "software/games/KAMENS.DAT",
  "software/games/TROPA.SAV", "software/games/POKER.SAV",
  "software/games/KOSTI.SAV", "software/games/MARS.SAV",
  "software/games/GO1.SAV", "software/games/KALAHI.SAV",
  "software/games/DERBY.SAV", "software/games/LOTOS.SAV",
  "software/games/TEN.SAV", "software/games/TIR.SAV",
  "software/games/UDAW.SAV",
]

