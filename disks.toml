  "software/system/format/FDZ.SAV",
  "software/system/utils/BADS.SAV",
  "software/system/utils/mihin/TERM.SAV",
  "software/system/handlers/mihin/VM.SYS",
  { path = "software/development/editors/K13U.SAV", as = "K52.SAV" },
