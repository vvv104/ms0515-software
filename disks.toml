# ---- presets -------------------------------------------------------------
# What the release builds and the web offers with one click: the bundles a
# person would tick; what they require comes by the same rules.
#   startup  lines of START.COM after the system's and the bundles' own
#   hint     what to do first, for the browser build's status line

[preset.games]
title   = "OSA: games"
system  = "osa"
media   = "dz"
bundles = ["sl-osa", "sabot2-osa", "fist", "sp13", "sp49", "pacm", "pac6", "labrn", "birds", "expres",
           "pent", "rubis", "ttr2", "kosmos-osa", "hanoj-osa",
           "king", "kam1", "tropa", "poker", "kosti", "mars", "go1", "kalahi", "derby", "lotos", "ten", "tir", "udaw"]
hint    = ". is the OS prompt: DIR lists the files, R SABOT2 / R FIST / R SP13 run the games; the text games are on side 1: R DZ2:KING"

[preset.devel]
title   = "OMEGA: development"
system  = "omega2"
media   = "dv"
bundles = ["sl-vvv", "pascal", "pascal-graphics", "pascal-units", "fortran", "basico", "ked", "dess", "spr",
           "datime-vvv", "form-vvv", "ld-omega", "ex", "lp", "mz", "hd-omega"]
hint    = ". is the OS prompt: DIR lists the files; PAS1, MACRO, LINK, FORTRA, BASICO compile, KED edits; with an HD image mounted, INIT HD: makes it a volume"

[preset.rodionov]
title   = "Rodionov: ROSA Commander"
system  = "rodionov"
media   = "dz"
bundles = ["sl-rodionov", "rosa3", "r15", "help-rodionov", "dump-rodionov", "vs-rodionov", "nl", "sce", "tfp",
           "resorc-osa", "screen-modes", "exerciser", "geteml", "basico", "rosa-docs", "r15-docs"]
startup = ["LOAD VM:", "R ROSA3"]
hint    = "ROSA Commander: the arrows move between the panels' files, Enter runs one, PM is the help key"

[preset.mihin]
title   = "Mihin: OS-16SJ"
system  = "mihin"
media   = "dz"
bundles = ["sl-mihin", "fdz", "bads", "term-mihin", "vm-mihin", "k52", "macro-mihin", "link-mihin", "hd-mihin"]
hint    = ". is the OS prompt: DIR lists the files; FDZ formats a diskette, K52 edits"
