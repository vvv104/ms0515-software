# names its systems and all builds of one handler provide one name.  The
# handlers the systems require are under System above.

[bundle.hd-osa]
title    = "HD.SYS - the emulator's hard disk"
group    = "Handlers"
provides = ["hd"]
systems  = ["osa"]
date     = "1995-04-01"
files    = ["software/system/handlers/osa/HD.SYS"]

