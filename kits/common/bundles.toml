# The files every system can take, of which the collection has one build:
# the RT-11 utilities no kit had a second copy of, the little programs of
# the machine, the printing programs, the factory diagnostics.  A kit's
# folder holds what is its own; this one what is everyone's.

[bundle.datset]
title = "DATSET - date setting of the OSA kit"
kit      = "common"
group = "Utilities"
date  = "1991-11-26"
files = ["kits/common/utils/DATSET.SAV"]

[bundle.tfp]
title = "TFP - text formatter of the OSA kit"
kit      = "common"
group = "Utilities"
date  = "1990-12-27"
files = ["kits/common/utils/TFP.SAV"]

[bundle.bads]
title = "BADS - bad-block scanner"
kit      = "common"
group = "Utilities"
date  = "1989-11-01"
files = ["kits/common/utils/BADS.SAV"]

[bundle.asc]
title = "ASC - character codes"
kit      = "common"
group = "Utilities"
date  = "1995-04-02"
files = ["kits/common/utils/ASC.SAV"]

[bundle.day]
title = "DAY - asks for a date"
kit      = "common"
group = "Utilities"
date  = "1986-02-14"
files = ["kits/common/utils/DAY.SAV"]

[bundle.blue]
title = "BLUE - the screen blue, yellow letters, back to the monitor"
kit      = "common"
group = "Utilities / Screen"
date  = "1992-12-04"
files = ["kits/common/utils/BLUE.SAV"]

[bundle.white]
title = "WHITE - the screen white, back to the monitor"
kit      = "common"
group = "Utilities / Screen"
date  = "1992-12-04"
files = ["kits/common/utils/WHITE.SAV"]

[bundle.neg]
title = "NEG - the 640x200 hi-res mode with a black border"
kit      = "common"
group = "Utilities / Screen"
date  = "1992-12-04"
files = ["kits/common/utils/NEG.SAV"]

# -- diskette formatters

[bundle.out17]
title = "OUT17 - text files to the MS6317 ink-jet printer"
kit      = "common"
group = "Utilities / Printing"
date  = "1995-01-01"
files = ["kits/common/print/OUT17.SAV", "kits/common/print/OUT17.DOC"]

[bundle.outc]
title = "OUTC - text files to the SM6337 printer"
kit      = "common"
group = "Utilities / Printing"
date  = "1995-01-01"
files = ["kits/common/print/OUTC.SAV", "kits/common/print/OUTC.DOC"]

[bundle.out2]
title = "OUT2 - of the OUT printing family"
kit      = "common"
group = "Utilities / Printing"
date  = "1991-12-17"
files = ["kits/common/print/OUT2.SAV"]

[bundle.p6337]
title = "6337 - print utility for the MS 6337 printer"
kit      = "common"
group = "Utilities / Printing"
date  = "1995-01-01"
files = ["kits/common/print/6337.SAV"]

# -- diagnostics

[bundle.geteml]
title = "GETEML - the loadable EIS/FIS instruction emulator"
kit      = "common"
group = "Utilities / Diagnostics"
date  = "1991-10-18"
files = ["kits/common/diag/GETEML.SAV"]

[bundle.exerciser]
title = "183107 - the factory exerciser"
kit      = "common"
group = "Utilities / Diagnostics"
date  = "1991-01-15"
files = ["kits/common/diag/183107.SAV"]

[bundle.timing]
title    = "The C* instruction-timing suite"
kit      = "common"
group    = "Utilities / Diagnostics"
date     = "1993-03-01"   # the disk says 2025: an age bit, 1993 + 32 (CRDWR, CRDWR1 were 1995-02-18)
requires = ["geteml"]
volume   = "any"
files    = ["kits/common/diag/C*.SAV"]

[bundle.scan-codes]
title = "SCN15I - keyboard scan-code viewer"
kit      = "common"
group = "Utilities / Diagnostics"
date  = "1995-04-25"   # the disk says 2027: an age bit, 1995 + 32
files = ["kits/common/diag/SCN15I.SAV"]
[bundle.sce]
title = "SCE - two-panel file manager, with its help"
kit      = "common"
group = "Shells"
date  = "1993-09-29"
files = ["kits/common/shells/SCE.SAV",
         { path = "kits/common/shells/SCE.HLP", date = "1989-01-04" }]

[bundle.format-rt11]
title    = "FORMAT - formats DZ, DV and MZ diskettes (DEC's, with a module for the machine's drive)"
kit      = "common"
date     = "1999-12-31"
files    = ["kits/common/utils/FORMAT.SAV"]

[bundle.edit-rt11]
title    = "EDIT - DEC's text editor"
kit      = "common"
date     = "1999-12-31"
files    = ["kits/common/utils/EDIT.SAV"]

[bundle.k52-rt11]
title    = "K52 - DEC's screen editor for the VT52 keypad (KED as built for this terminal)"
kit      = "common"
startup  = ["SET EDIT K52"]    # the monitor's EDIT command runs it: EDIT FILE.TXT
date     = "1999-12-31"
files    = ["kits/common/utils/K52.SAV"]

[bundle.patch-rt11]
title    = "SLP, PAT, SIPP - patching sources, objects and programs"
kit      = "common"
date     = "1999-12-31"
files    = ["kits/common/utils/SLP.SAV", "kits/common/utils/PAT.SAV", "kits/common/utils/SIPP.SAV"]

[bundle.strip-rt11]
title    = "STRIP and SPLIT"
kit      = "common"
date     = "1999-12-31"
files    = ["kits/common/utils/STRIP.SAV", "kits/common/utils/SPLIT.SAV"]

[bundle.calend]
kit      = "common"
title = "CALEND - calendar for 1583-5000"
date  = "1994-06-16"
files = ["kits/common/utils/CALEND.SAV"]

# ---- development ----------------------------------------------------------
# The compilers and their libraries, the editors, the debugger and the two
# BASICs: one build of each, and none of them minds which monitor it runs
# under.

[bundle.sysmac]
kit      = "common"
title = "SYSMAC.SML - the system macro library"
provides = ["sysmac"]
date  = "1995-04-01"
files = ["kits/common/development/SYSMAC.SML"]

[bundle.syslib]
kit      = "common"
title = "SYSLIB.OBJ - the system library"
date  = "1995-04-01"
files = ["kits/common/development/SYSLIB.OBJ"]

[bundle.hello-pas]
kit      = "common"
title    = "HELLO.PAS - a Hello, world! to build first: PAS1, MACRO, LINK, RUN"
requires = ["pascal"]
date     = "1992-04-01"     # written for the collection in 2026: the Pascal disk's working date
files    = ["programs/examples/HELLO.PAS"]

[bundle.hello-mac]
kit      = "common"
title    = "HELLOA.MAC - the same Hello, world! in MACRO-11: MACRO, LINK, RUN"
requires = ["macro11", "link"]
date     = "1992-04-01"     # written for the collection in 2026: the Pascal disk's working date
files    = ["programs/examples/HELLOA.MAC"]

