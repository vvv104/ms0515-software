# ---- development ----------------------------------------------------------
# The compilers and their libraries, the editors, the debugger and the two
# BASICs: one build of each, and none of them minds which monitor it runs
# under.

[bundle.sysmac]
kit      = "common"
title = "SYSMAC.SML - the system macro library"
date  = "1995-04-01"
files = ["kits/common/development/SYSMAC.SML"]

[bundle.syslib]
kit      = "common"
title = "SYSLIB.OBJ - the system library"
date  = "1995-04-01"
files = ["kits/common/development/SYSLIB.OBJ"]

[bundle.pascal]
kit      = "common"
title    = "Pascal - PAS1 with its run-time library"
requires = ["macro11", "link", "syslib"]     # PAS1 emits MACRO-11, LINK binds PASLIB
prefer   = { mihin = ["macro-mihin", "link-mihin"], default = ["macro-vvv", "link-vvv"] }
date     = "1995-04-01"
files    = ["kits/common/development/PAS1.SAV",
            "kits/common/development/PAS1.OBJ",
            "kits/common/development/PASLIB.OBJ"]

[bundle.pascal-graphics]
kit      = "common"
title    = "Pascal graphics - PASGRF and GRAPH.P1U"
requires = ["pascal"]
date     = "1995-04-01"
files    = ["kits/common/development/PASGRF.OBJ", "kits/common/development/GRAPH.P1U"]

[bundle.pascal-units]
kit      = "common"
title    = "Pascal units - STRING, SETPIX, GETDAT sources"
requires = ["pascal"]
volume   = "any"
date     = "1995-04-01"
files    = ["kits/common/development/STRING.PAS",
            "kits/common/development/SETPIX.PAS",
            "kits/common/development/GETDAT.PAS"]

[bundle.pascal-docs]
kit      = "common"
title    = "Pascal manuals - PASCAL.LST, PASUSE.LST, PASGR.DOC"
date     = "1995-05-16"
requires = ["pascal"]
volume   = "any"
files    = ["kits/common/development/PASCAL.LST",
            "kits/common/development/PASUSE.LST",
            { path = "kits/common/development/PASGR.DOC", date = "1995-05-15" }]

[bundle.forlib]
kit      = "common"
title = "FORLIB.OBJ - the FORTRAN IV run-time library"
date  = "1995-04-01"
files = ["kits/common/development/FORLIB.OBJ"]

