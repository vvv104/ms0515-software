[system.dec]
title    = "RT-11SJ V05.04 (DEC's, for the MS 0515)"
kit      = "dec"
monitor  = { path = "kits/dec/RT11SJ.SYS", date = "1999-12-31" }
swap     = { blocks = 32, date = "1999-12-31" }
startup_date = "1999-12-31"
media    = ["ss", "dz", "dv"]
requires = ["tt-rt11"]
suggests = ["dir-rt11", "dup-rt11", "pip-rt11"]
requires_by_media = { ss = ["dz-rt11"], dz = ["dz-rt11"], dv = ["dv-rt11"] }
startup  = ["SET TT QUIET"]

[system.dec-ru]
title    = "RT-11SJ V05.04 (DEC's, for the MS 0515), in Russian"
kit      = "dec"
monitor  = { path = "kits/dec/dec-ru/RT11SJ.SYS", date = "1999-12-31" }
swap     = { blocks = 32, date = "1999-12-31" }
startup_date = "1999-12-31"
media    = ["ss", "dz", "dv"]
requires = ["tt-rt11"]
suggests = ["dir-rt11", "dup-rt11", "pip-rt11"]
requires_by_media = { ss = ["dz-rt11"], dz = ["dz-rt11"], dv = ["dv-rt11"] }
startup  = ["SET TT QUIET"]

# ---- dec -------------------------------------------------------------------

# -- RT-11 from sources: the handlers written or built in the emulator
# repository (rt11_devel/projects/rt11) for the dec systems.  DZ, DV, MZ, TT,
# VM, EX and HD are the machine's own, with sources; NL, LD, LP, LS, SP and BA
# are DEC's V5.4 as they are.  DEC's SL is not here: its screen control does
# not fit the console, and the kits' SL load under the dec monitors.

[bundle.dz-rt11]
title    = "DZ.SYS - the floppy handler (from sources)"
kit      = "dec"
provides = ["dz"]
systems  = ["dec", "dec-ru"]
protect  = true
date     = "1999-12-31"
files    = ["kits/dec/handlers/DZ.SYS"]

[bundle.dv-rt11]
title    = "DV.SYS - the whole-disk DV handler (from sources)"
