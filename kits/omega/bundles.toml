[system.omega]
title    = "OMEGA SJ(S) V05.04"
kit      = "omega"
monitor  = { path = "kits/omega/RT11SJ.SYS", date = "1991-11-12" }
swap     = { blocks = 32, date = "1989-12-11" }
startup_date = "1995-04-01"
media    = ["ss", "dz", "dv"]
requires = ["tt-omega"]
suggests = ["dir-omega", "dup-omega", "pip-omega"]
requires_by_media = { ss = ["dz-omega"], dz = ["dz-omega"], dv = ["dv-omega"] }
startup  = ["SET TT QUIET"]

# ---- omega -----------------------------------------------------------------

[bundle.dz-omega]
title    = "DZ.SYS - the floppy handler (OMEGA)"
kit      = "omega"
provides = ["dz"]
systems  = ["omega", "omega2", "dec", "dec-ru"]
protect  = true
date     = "1991-11-04"
files    = ["kits/omega/handlers/DZ.SYS"]

[bundle.dv-omega]
title    = "DV.SYS - the whole-disk DV handler"
