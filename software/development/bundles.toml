# ==== Development ==========================================================

[bundle.sysmac]
title = "SYSMAC.SML - the system macro library"
group = "Development / Assembler"
date  = "1995-04-01"
files = ["software/development/macro/SYSMAC.SML"]

[bundle.syslib]
title = "SYSLIB.OBJ - the system library"
group = "Development / Linker"
date  = "1995-04-01"
files = ["software/development/pascal/SYSLIB.OBJ"]

[bundle.pascal]
title    = "Pascal - PAS1 with its run-time library"
group    = "Development / Pascal"
requires = ["macro11", "link", "syslib"]     # PAS1 emits MACRO-11, LINK binds PASLIB
prefer   = { mihin = ["macro-mihin", "link-mihin"], default = ["macro-vvv", "link-vvv"] }
date     = "1995-04-01"
files    = ["software/development/pascal/PAS1.SAV",
            "software/development/pascal/PAS1.OBJ",
            "software/development/pascal/PASLIB.OBJ"]

[bundle.pascal-graphics]
title    = "Pascal graphics - PASGRF and GRAPH.P1U"
group    = "Development / Pascal"
requires = ["pascal"]
date     = "1995-04-01"
files    = ["software/development/pascal/PASGRF.OBJ", "software/development/pascal/GRAPH.P1U"]

[bundle.pascal-units]
title    = "Pascal units - STRING, SETPIX, GETDAT sources"
group    = "Development / Pascal"
requires = ["pascal"]
volume   = "any"
date     = "1995-04-01"
files    = ["software/development/pascal/STRING.PAS",
            "software/development/pascal/SETPIX.PAS",
            "software/development/pascal/GETDAT.PAS"]

[bundle.pascal-docs]
title    = "Pascal manuals - PASCAL.LST, PASUSE.LST, PASGR.DOC"
group    = "Development / Pascal"
date     = "1995-05-16"
requires = ["pascal"]
volume   = "any"
files    = ["software/development/pascal/PASCAL.LST",
            "software/development/pascal/PASUSE.LST",
            { path = "software/development/pascal/PASGR.DOC", date = "1995-05-15" }]

[bundle.hello-pas]
title    = "HELLO.PAS - a Hello, world! to build first: PAS1, MACRO, LINK, RUN"
group    = "Development / Pascal"
requires = ["pascal"]
date     = "1992-04-01"     # written for the collection in 2026: the Pascal disk's working date
files    = ["programs/examples/HELLO.PAS"]

[bundle.hello-mac]
title    = "HELLOA.MAC - the same Hello, world! in MACRO-11: MACRO, LINK, RUN"
group    = "Development / Assembler"
requires = ["macro11", "link"]
date     = "1992-04-01"     # written for the collection in 2026: the Pascal disk's working date
files    = ["programs/examples/HELLOA.MAC"]

[bundle.forlib]
