# ==== Development ==========================================================

# ---- DECUS C -------------------------------------------------------------
# The C compiler, rebuilt from the RT-11 SIG tape's sources on the dec system
# (rt11_devel/projects/decusc of the emulator), in two builds of the same
# names: the folder itself for the machine as it is, eis/ for the machine with
# EM.SYS, the instruction emulator.  A diskette takes one of the two; the
# headers serve either, and the tools come in three parts so that one fits
# beside the compiler.

[bundle.decusc]
group    = "Development"
title    = "DECUS C - the compiler, its assembler and library, for the T11 (no EIS)"
provides = ["decus-c"]
requires = ["link"]
prefer   = { mihin = ["link-mihin"], default = ["link-vvv"] }
date     = "1983-10-13"
files    = ["software/development/decusc/CC.SAV",
            "software/development/decusc/AS.SAV",
            "software/development/decusc/CLIB.OBJ",
            "software/development/decusc/SUPORT.OBJ",
            "software/development/decusc/DTOA.OBJ",
            "software/development/decusc/ATOF.OBJ"]

[bundle.decusc-eis]
group    = "Development"
title    = "DECUS C for EM.SYS - the compiler, its assembler and library with EIS inline"
provides = ["decus-c"]
requires = ["link", "em"]
prefer   = { mihin = ["link-mihin"], default = ["link-vvv"] }
date     = "1983-10-13"
files    = ["software/development/decusc/eis/CC.SAV",
            "software/development/decusc/eis/AS.SAV",
            "software/development/decusc/eis/CLIB.OBJ",
            "software/development/decusc/eis/SUPORT.OBJ",
            "software/development/decusc/eis/DTOA.OBJ",
            "software/development/decusc/eis/ATOF.OBJ"]

[bundle.decusc-headers]
group    = "Development"
title    = "DECUS C - the headers (STDIO.H, CTYPE.H, TIME.H, ...)"
