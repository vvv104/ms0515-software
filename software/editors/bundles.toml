# ==== Editors ==============================================================

[bundle.ked]
group    = "Editors"
title    = "KED - keypad screen editor (vvv104 disks)"
provides = ["k13-editor"]
date     = "1995-04-01"
files    = ["software/editors/KED.SAV"]

[bundle.k52]
group    = "Editors"
title    = "K52 - screen editor of the OSA and OMEGA kits"
provides = ["k13-editor"]
date     = "1991-01-31"
files    = [{ path = "software/editors/K13U.SAV", as = "K52.SAV" }]

[bundle.r15]
group    = "Editors"
title    = "R15 - Rodionov's edition of the editor, with its help"
provides = ["k13-editor"]
date     = "1990-11-29"
files    = ["software/editors/R15.SAV",
            { path = "software/editors/R15.HLP", date = "1993-03-24" }]

[bundle.r15-docs]
group    = "Editors"
title    = "R15.DOC - the manual of the K13 family editor"
volume   = "any"
date     = "1993-08-09"
files    = ["software/editors/R15.DOC"]

[bundle.edit-rt11]
title    = "EDIT - DEC's text editor"
group    = "Editors"
date     = "1999-12-31"
files    = ["software/editors/EDIT.SAV"]

[bundle.k52-rt11]
title    = "K52 - DEC's screen editor for the VT52 keypad (KED as built for this terminal)"
group    = "Editors"
startup  = ["SET EDIT K52"]    # the monitor's EDIT command runs it: EDIT FILE.TXT
date     = "1999-12-31"
files    = ["software/editors/K52.SAV"]
